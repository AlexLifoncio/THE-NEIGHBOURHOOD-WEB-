<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tu perfil en la comunidad de fans de The Neighbourhood.">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Mi perfil | The Neighbourhood</title>
    <link rel="icon" type="image/png" href="../img/LOGO.jpg" sizes="64x64">
</head>
<body data-page="perfil">
    <header>
        <nav>
            <div class="logo"><a href="../index.html">THE NBHD</a></div>
            <ul class="nav-links">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="../index.html#albums">Discografía</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-main">
        <div class="auth-card profile-card">
            <div class="profile-avatar" id="profile-avatar">?</div>
            <h1 id="profile-name">Cargando...</h1>
            <p class="auth-subtitle" id="profile-email"></p>
            <p class="profile-bio" id="profile-bio"></p>

            <dl class="profile-meta">
                <div>
                    <dt>Miembro desde</dt>
                    <dd id="profile-since"></dd>
                </div>
                <div>
                    <dt>Estado</dt>
                    <dd>Fan de THE NBHD</dd>
                </div>
            </dl>

            <p class="auth-message" role="status" aria-live="polite"></p>

            <form id="profile-form" class="auth-form profile-form">
                <div class="form-group">
                    <label for="profile-username">Nombre de usuario</label>
                    <input type="text" id="profile-username" autocomplete="username" minlength="3" maxlength="20" required>
                </div>
                <div class="form-group">
                    <label for="profile-bio-input">Bio</label>
                    <textarea id="profile-bio-input" rows="3" maxlength="280" placeholder="Cuéntanos qué te gusta de THE NBHD..."></textarea>
                </div>
                <div class="form-group">
                    <label for="profile-avatar-file">Imagen de perfil</label>
                    <input type="file" id="profile-avatar-file" accept="image/png,image/jpeg,image/webp,image/gif">
                    <span class="form-hint">JPG, PNG, WEBP o GIF. Máximo 2 MB.</span>
                </div>
                <button type="submit" class="btn-action btn-block">Guardar cambios</button>
            </form>

            <button id="logout-btn" class="btn-action btn-block btn-secondary">Cerrar sesión</button>

            <p class="auth-footer"><a href="../index.html">Volver al inicio</a></p>
        </div>
    </main>

    <footer>
        <p>&copy; Sitio Fan de The Neighbourhood.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
